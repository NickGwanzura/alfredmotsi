<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="96" fill="#00695c"/>
  <circle cx="100" cy="100" r="92" fill="#00796b"/>
  
  <!-- Snowflake / HVAC icon -->
  <g stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Vertical line -->
    <line x1="100" y1="35" x2="100" y2="165"/>
    <!-- Horizontal line -->
    <line x1="35" y1="100" x2="165" y2="100"/>
    <!-- Diagonal lines -->
    <line x1="54" y1="54" x2="146" y2="146"/>
    <line x1="146" y1="54" x2="54" y2="146"/>
    
    <!-- Top branches -->
    <line x1="100" y1="48" x2="78" y2="62"/>
    <line x1="100" y1="48" x2="122" y2="62"/>
    <!-- Bottom branches -->
    <line x1="100" y1="152" x2="78" y2="138"/>
    <line x1="100" y1="152" x2="122" y2="138"/>
    <!-- Left branches -->
    <line x1="48" y1="100" x2="62" y2="78"/>
    <line x1="48" y1="100" x2="62" y2="122"/>
    <!-- Right branches -->
    <line x1="152" y1="100" x2="138" y2="78"/>
    <line x1="152" y1="100" x2="138" y2="122"/>
  </g>
  
  <!-- Inner circle accent -->
  <circle cx="100" cy="100" r="18" fill="none" stroke="white" stroke-width="2.5"/>
  <circle cx="100" cy="100" r="6" fill="white"/>
</svg>
