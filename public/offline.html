<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#093a68" />
    <title>Splash Air CRM — Offline</title>
    <style>
      :root { color-scheme: light; font-family: Arial, sans-serif; background: #f7fafc; color: #13233f; }
      body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; box-sizing: border-box; }
      main { max-width: 420px; text-align: center; background: #fff; border-radius: 20px; padding: 36px 28px; box-shadow: 0 12px 32px rgba(9, 58, 104, .12); }
      img { width: 96px; height: 96px; margin-bottom: 20px; }
      h1 { margin: 0 0 12px; font-size: 24px; }
      p { margin: 0; color: #59677b; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Splash Air" />
      <h1>You’re offline</h1>
      <p>Reconnect to the internet to continue using Splash Air CRM.</p>
    </main>
  </body>
</html>
